name: Prueba automática HSF (video corto + subida a YouTube)

on:
  workflow_dispatch: {}
  schedule:
    # 5:00 AM y 19:00 (7pm) hora Perú (UTC-5) = 10:00 y 00:00 UTC
    - cron: "0 10 * * *"
    - cron: "0 0 * * *"

jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configurar rclone (credenciales de Drive)
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Generar video de prueba + subir a YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Privado por defecto para no ensuciar el canal con pruebas.
          # Cuando pasemos al pipeline real, se cambia a "public".
          HSF_PRIVACIDAD_YOUTUBE: "private"
        run: |
          python3 << 'PYEOF'
          import subprocess
          import logging
          import hsf_engine
          from hsf_engine import agregar_intro_resumen, _obtener_plantilla_intro_desde_drive, _subir_ultimo_resultado_a_youtube

          logger = logging.getLogger("prueba_actions")
          logger.addHandler(logging.StreamHandler())
          logger.setLevel(logging.INFO)

          subprocess.run([
              "ffmpeg", "-y", "-f", "lavfi", "-i", "color=c=gray:s=1080x1920:d=30",
              "-f", "lavfi", "-i", "anullsrc=r=44100:cl=stereo",
              "-shortest", "-c:v", "libx264", "-c:a", "aac", "video_prueba_30s.mp4",
          ], check=True)

          ruta_plantilla_intro = _obtener_plantilla_intro_desde_drive(logger=logger)

          resultado = agregar_intro_resumen(
              ruta_video="video_prueba_30s.mp4",
              ruta_plantilla=ruta_plantilla_intro,
              resumen_texto="Prueba automatica desde GitHub Actions: video de 30 segundos con intro y miniatura.",
              ruta_salida="video_final_prueba.mp4",
              logger=logger,
          )
          print("Intro agregada:", resultado)

          hsf_engine._ULTIMO_RESULTADO_AUTOMATICO = {
              "ruta_video": "video_final_prueba.mp4",
              "titulo_resumen": "Prueba automatica GitHub Actions (video de test, ignorar)",
              "guion": "Video de prueba generado automaticamente para verificar el flujo de GitHub Actions.",
              "subreddits": [],
              "cantidad_historias": 1,
              "carpeta_proyecto": ".",
          }

          _subir_ultimo_resultado_a_youtube(logger)
          PYEOF
