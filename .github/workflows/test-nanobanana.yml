name: Test miniatura nanobanana

on:
  workflow_dispatch: {}

jobs:
  test_nanobanana:
    runs-on: ubuntu-latest
    steps:
      - name: Generar 5 miniaturas de prueba con nanobanana-pro
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import os, requests, base64

          base = (
              "Miniatura de YouTube fotorrealista, una sola imagen a pantalla completa "
              "(sin paneles ni tarjetas separadas). Analiza el titular y la frase de la franja roja "
              "que se muestran abajo, interpreta de que trata el conflicto, y genera una escena "
              "fotorrealista que represente ese conflicto de forma dramatica: si el texto sugiere una "
              "confrontacion directa entre dos personas (traicion, pelea, acusacion), muestra 2 personas "
              "cara a cara; si el texto sugiere un conflicto con un tercero involucrado, muestra 3 personas "
              "con roles claros; si el texto sugiere un descubrimiento o momento intimo y solitario, "
              "muestra 1 sola persona en primer plano. "
              "La escena debe ser SIEMPRE en primer plano o medio plano, con el/los rostro(s) ocupando "
              "gran parte del frame (nunca personas chicas o lejanas). Debe ocurrir dentro de una casa, "
              "con iluminacion dramatica de cine tipo thriller usando siempre luz lateral proveniente de "
              "una ventana, sombras marcadas, y SIEMPRE el mismo tono de color frio/desaturado con tinte "
              "azulado en las sombras, para mantener identidad visual consistente entre miniaturas. "
              "Expresiones faciales de dolor, ira contenida o shock genuino (no actuadas). Con un degradado "
              "oscuro semitransparente que cubre la parte superior e inferior de la imagen para que el "
              "texto se lea bien encima de la foto. "
              "Arriba a la izquierda, chico: un logo circular rojo/bordo con las letras 'HSF' y al lado el "
              "texto blanco 'Historia Sin Filtro', SIEMPRE del mismo tamano y posicion exacta. "
              "Debajo de eso, ocupando la parte superior, un titular en mayuscula, fuente gruesa tipo impact, "
              "SIEMPRE color blanco con la ultima palabra clave en amarillo, texto exacto: '{titular}'. "
              "Abajo del todo, SIEMPRE una franja roja solida (mismo tono de rojo) de ancho completo con "
              "texto blanco en mayuscula: '{franja}'. "
              "Estilo miniatura de YouTube clickbait de historias reales tipo true crime/drama familiar, "
              "sin marco ni borde de color, sin panel blanco, todo el texto quemado directamente sobre la "
              "foto, letras grandes con buen espacio entre lineas para que no se pisen entre si. "
              "Resolucion 1280x720."
          )

          casos = [
              {"titular": "MI HERMANA ME TRAICIONO", "franja": "POR DINERO"},
              {"titular": "ENCONTRE EL TESTAMENTO", "franja": "Y TODO CAMBIO"},
              {"titular": "MI HERENCIA DESAPARECIO", "franja": "NADIE QUISO EXPLICARME POR QUE"},
              {"titular": "ME ECHARON DE LA FAMILIA", "franja": "POR DECIR LA VERDAD"},
              {"titular": "EL SECRETO DE MI ABUELA", "franja": "SALIO A LA LUZ"},
          ]

          for i, caso in enumerate(casos, start=1):
              prompt = base.format(**caso)
              resp = requests.post(
                  "https://gen.pollinations.ai/v1/images/generations",
                  headers={
                      "Authorization": f"Bearer {os.environ['POLLINATIONS_API_KEY']}",
                      "Content-Type": "application/json",
                  },
                  json={"model": "nanobanana-pro", "prompt": prompt, "size": "1280x720"},
                  timeout=120,
              )
              print(f"[{i}] Status:", resp.status_code)
              data = resp.json()
              b64 = data["data"][0]["b64_json"]
              with open(f"miniatura_{i}.png", "wb") as f:
                  f.write(base64.b64decode(b64))
              print(f"Guardada miniatura_{i}.png")
          PYEOF

      - name: Subir miniaturas como artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miniaturas-prueba
          path: miniatura_*.png
