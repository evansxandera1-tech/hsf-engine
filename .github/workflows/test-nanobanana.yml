name: Test miniatura nanobanana

on:
  workflow_dispatch: {}

jobs:
  test_nanobanana:
    runs-on: ubuntu-latest
    steps:
      - name: Generar miniatura de prueba con nanobanana-pro
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import os, requests, base64

          prompt = (
              "Miniatura de YouTube fotorrealista, una sola imagen a pantalla completa "
              "(sin paneles ni tarjetas separadas), mostrando dos personas confrontandose "
              "en una discusion familiar tensa dentro de una casa, iluminacion dramatica de cine, "
              "con un degradado oscuro semitransparente que cubre la parte superior e inferior de la imagen "
              "para que el texto se lea bien encima de la foto. "
              "Arriba a la izquierda, chico: un logo circular rojo/bordo con las letras 'HSF' "
              "y al lado el texto blanco 'Historia Sin Filtro'. "
              "Debajo de eso, ocupando la parte superior, un titular en mayuscula, fuente gruesa tipo impact, "
              "color blanco con la palabra 'HERENCIA' en amarillo, texto exacto: "
              "'MI HERMANO ME ACUSO DE ARRUINAR LA HERENCIA DE MIS ABUELOS'. "
              "Abajo del todo, una franja roja solida de ancho completo con texto blanco en mayuscula: "
              "'LA HISTORIA QUE NADIE SE ATREVIO A CONTAR'. "
              "Estilo miniatura de YouTube clickbait de historias reales, sin marco ni borde de color, "
              "sin panel blanco, todo el texto quemado directamente sobre la foto. "
              "Resolucion 1280x720."
          )

          resp = requests.post(
              "https://gen.pollinations.ai/v1/images/generations",
              headers={
                  "Authorization": f"Bearer {os.environ['POLLINATIONS_API_KEY']}",
                  "Content-Type": "application/json",
              },
              json={"model": "nanobanana-pro", "prompt": prompt, "size": "1280x720"},
              timeout=120,
          )
          print("Status:", resp.status_code)
          data = resp.json()

          b64 = data["data"][0]["b64_json"]
          with open("miniatura_prueba.png", "wb") as f:
              f.write(base64.b64decode(b64))
          print("Guardada miniatura_prueba.png")
          PYEOF

      - name: Subir miniatura como artifact
        uses: actions/upload-artifact@v4
        with:
          name: miniatura-prueba
          path: miniatura_prueba.png
