name: Test Chatterbox corto

on:
  workflow_dispatch:

jobs:
  test-chatterbox:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffmpeg y rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          curl https://rclone.org/install.sh | sudo bash

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Compilar whisper.cpp
        run: |
          git clone https://github.com/ggerganov/whisper.cpp.git ~/whisper.cpp
          cd ~/whisper.cpp
          cmake -B build
          cmake --build build --config Release -j
          bash ./models/download-ggml-model.sh base

      - name: Configurar rclone (gdrive + gdrive2)
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Correr test de Chatterbox (2 min)
        run: python test_chatterbox.py

      - name: Subir video de prueba como artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-prueba-chatterbox
          path: videos_hsf/**/*.mp4
          retention-days: 7
