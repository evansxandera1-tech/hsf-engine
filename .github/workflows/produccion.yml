name: Produccion HSF (video real automatico, 2x al dia)

on:
  workflow_dispatch: {}
  schedule:
    # 5:00 AM y 19:00 (7pm) hora Peru (UTC-5) = 10:00 y 00:00 UTC
    - cron: "0 10 * * *"
    - cron: "0 0 * * *"

jobs:
  produccion:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configurar rclone (credenciales de Drive)
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Generar video real (texto de Drive + gameplay) + subir a YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          HSF_PRIVACIDAD_YOUTUBE: "public"
        run: |
          python3 << 'PYEOF'
          import logging
          import hsf_engine
          from hsf_engine import (
              _pipeline_video_automatico, _subir_ultimo_resultado_a_youtube,
              crear_logger_video,
          )

          # Se usa la funcion real del motor en vez de reimplementar la logica
          # aca (eso fue lo que causaba que el titulo/miniatura salieran
          # genericos: el workflow armaba el resultado a mano y le faltaba
          # el titulo real y la historia completa).
          logger, ruta_log = crear_logger_video()
          _pipeline_video_automatico(logger, ruta_log)

          # Logger nuevo para la subida: el de arriba se cierra solo al
          # terminar de generar el video (cerrar_logger_video), y si se
          # reusa se pierden los logs de esta parte.
          logger_subida = logging.getLogger("subida_youtube")
          logger_subida.addHandler(logging.StreamHandler())
          logger_subida.setLevel(logging.INFO)
          _subir_ultimo_resultado_a_youtube(logger_subida)
          PYEOF
