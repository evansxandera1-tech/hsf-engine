name: Test video corto (2 min, prueba puntual)

on:
  workflow_dispatch: {}

jobs:
  test_video_corto:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configurar rclone (credenciales de Drive)
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG_BASE64 }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Instalar dependencias de Python
        run: pip install -r requirements.txt

      - name: Generar video de prueba (resumido a ~2 min) + subir a YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          HSF_PRIVACIDAD_YOUTUBE: "unlisted"
        run: |
          python3 << 'PYEOF'
          import logging
          import os
          import subprocess
          import hsf_engine
          from hsf_engine import (
              procesar_todo, _elegir_texto_desde_drive, _marcar_texto_usado_en_drive,
              _elegir_gameplay_desde_drive, _llamar_gemini,
              _subir_ultimo_resultado_a_youtube, ESTADO, CANDADO_ESTADO, CARPETA_VIDEOS,
              FUENTE_POR_DEFECTO, VELOCIDAD_VOZ_POR_DEFECTO, TONO_VOZ_POR_DEFECTO,
              VELOCIDAD_EFECTO_POR_DEFECTO, GEMINI_API_KEY,
          )

          logger = logging.getLogger("test_video_corto")
          logger.addHandler(logging.StreamHandler())
          logger.setLevel(logging.INFO)

          # ---- Elegir historia + recortar a ~2 min (solo prueba, SIN Gemini) ----
          # Antes se le pedia a Gemini que "resumiera" la historia completa,
          # pero eso obligaba a Gemini a reescribir/parafrasear el contenido
          # explicito de la historia, y varias veces la bloqueaba
          # (blockReason=PROHIBITED_CONTENT), abortando todo el video.
          # Ahora el guion se corta directo por cantidad de palabras (nada
          # de IA de por medio, no hay nada que pueda bloquear) y el
          # respaldo de ffmpeg mas abajo recorta el video si aun asi se
          # pasa de 2 min. El titulo y la miniatura siguen usando la
          # historia COMPLETA (guion_completo), no el recorte, para no
          # perder contexto ni el detalle mas escandaloso de la historia.
          PALABRAS_OBJETIVO_CORTO = 300

          guion_completo, nombre_archivo_texto = _elegir_texto_desde_drive(logger=logger)
          if not guion_completo:
              raise RuntimeError("No se encontro ningun texto listo en textos_listos_gdrive.")

          # Titulo real (mismo criterio que usa _pipeline_video_automatico):
          # antes esto se sacaba de resultado.get("titulo"), que no existe
          # en ningun lado y siempre daba el generico "Video de prueba (2 min)".
          titulo_resumen = os.path.splitext(nombre_archivo_texto)[0].replace("_", " ").strip()

          palabras = guion_completo.split()
          guion = " ".join(palabras[:PALABRAS_OBJETIVO_CORTO])
          print(f"Guion recortado (sin IA, solo prueba corta): {len(palabras)} palabras -> {len(guion.split())} palabras", flush=True)

          ruta_gameplay = _elegir_gameplay_desde_drive(logger=logger)
          if not ruta_gameplay:
              raise RuntimeError("No se encontro gameplay disponible en gameplay_slither.")

          procesar_todo(
              guion, 3, "centro", "oro_viejo", 42, FUENTE_POR_DEFECTO, "piano", 12, [], "dinamico",
              False, False, VELOCIDAD_VOZ_POR_DEFECTO, TONO_VOZ_POR_DEFECTO,
              opacidad_sub=100, cantidad_imagenes_descargar=0, ancho_sub_pct=73, pos_y_pct=50,
              efecto_video="ninguno", velocidad_efecto=VELOCIDAD_EFECTO_POR_DEFECTO,
              fondo_gameplay=True, ruta_gameplay=ruta_gameplay,
              logger=logger, ruta_log=None,
          )

          with CANDADO_ESTADO:
              resultado = dict(ESTADO.get("resultado") or {})
          if not resultado.get("video"):
              raise RuntimeError(f"El pipeline de video fallo: {resultado.get('mensaje', 'sin detalle')}")

          ruta_video_absoluta = os.path.join(CARPETA_VIDEOS, resultado["video"])
          print("Video generado en:", ruta_video_absoluta, flush=True)

          # ---- Respaldo: si aun asi quedo mas largo de 2 min, se recorta duro ----
          cmd_duracion = [
              "ffprobe", "-v", "error", "-show_entries", "format=duration",
              "-of", "default=noprint_wrappers=1:nokey=1", ruta_video_absoluta,
          ]
          duracion_actual = 0.0
          try:
              duracion_actual = float(subprocess.run(cmd_duracion, capture_output=True, text=True).stdout.strip())
          except Exception:
              pass
          print(f"Duracion del video generado: {duracion_actual:.1f}s", flush=True)

          if duracion_actual > 125:
              ruta_video_recortado = ruta_video_absoluta + ".recortado.mp4"
              cmd_recorte = [
                  "ffmpeg", "-y", "-i", ruta_video_absoluta,
                  "-t", "120", "-c", "copy", ruta_video_recortado,
              ]
              resultado_recorte = subprocess.run(cmd_recorte, capture_output=True, text=True)
              if resultado_recorte.returncode != 0 or not os.path.exists(ruta_video_recortado):
                  cmd_recorte = ["ffmpeg", "-y", "-i", ruta_video_absoluta, "-t", "120", ruta_video_recortado]
                  resultado_recorte = subprocess.run(cmd_recorte, capture_output=True, text=True)
              if resultado_recorte.returncode == 0 and os.path.exists(ruta_video_recortado):
                  os.replace(ruta_video_recortado, ruta_video_absoluta)
                  print("El resumen se paso de largo, se aplico recorte duro a 2 minutos como respaldo.", flush=True)
              else:
                  print(f"No se pudo aplicar el recorte de respaldo: {resultado_recorte.stderr[-500:]}", flush=True)
          else:
              print("El video ya quedo dentro de los 2 minutos gracias al resumen, no hizo falta recortar.", flush=True)

          logger_subida = logging.getLogger("subida_youtube_test")
          logger_subida.addHandler(logging.StreamHandler())
          logger_subida.setLevel(logging.INFO)

          hsf_engine._ULTIMO_RESULTADO_AUTOMATICO = {
              "ruta_video": ruta_video_absoluta,
              "titulo_resumen": titulo_resumen,
              "guion": guion_completo,
              "subreddits": [],
              "cantidad_historias": 1,
              "carpeta_proyecto": os.path.dirname(ruta_video_absoluta),
          }

          _subir_ultimo_resultado_a_youtube(logger_subida)
          _marcar_texto_usado_en_drive(nombre_archivo_texto, logger=logger_subida)
          PYEOF
